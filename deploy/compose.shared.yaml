# Run from /opt/projects/office_desk_gear with:
# docker compose --project-name office-desk-gear --env-file .env.server -f deploy/compose.shared.yaml up -d --build
# Shared nginx/Caddy owns 80/443. This project exposes only its loopback API.
services:
  db:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: office_desk_gear
      POSTGRES_USER: odg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [database]
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=30, -c, work_mem=4MB, -c, maintenance_work_mem=32MB]
    mem_limit: 256m
    pids_limit: 128
    logging: &logging
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U odg -d office_desk_gear']
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://odg:${POSTGRES_PASSWORD}@db:5432/office_desk_gear
      APP_ENV: ${APP_ENV:-production}
      APP_ROOT_PATH: ${APP_ROOT_PATH:-/office-desk-gear}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      QR_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL}/api/v1/equipment
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-1}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-1}
      MAIL_MODE: ${MAIL_MODE:-smtp}
      DATA_DIR: /app/server/data
      TZ: Europe/Moscow
    volumes:
      - api_data:/app/server/data
    ports:
      - '127.0.0.1:${API_BIND_PORT:-8011}:8000'
    networks: [database, service]
    command: [sh, -c, "python -m alembic upgrade head && exec python -m uvicorn server.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*' --workers 1"]
    mem_limit: 384m
    pids_limit: 128
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777']
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *logging
networks:
  database:
    internal: true
  service: {}
volumes:
  postgres_data:
  api_data:
