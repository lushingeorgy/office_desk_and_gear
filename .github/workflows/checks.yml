name: PostgreSQL acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: odg_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d odg_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci-only-password@127.0.0.1:5432/odg_test
      JWT_SECRET: ci-only-signing-secret-minimum-32-characters
      APP_ENV: test
      TZ: Europe/Moscow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q server client main.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build backend container
        run: docker build --tag office-desk-gear:ci .
      - name: Check container migrations and readiness
        run: |
          docker run -d --name odg-api-ci --network host -e DATABASE_URL -e JWT_SECRET -e APP_ENV=test office-desk-gear:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready; then exit 0; fi
            sleep 2
          done
          docker logs odg-api-ci
          exit 1
      - name: Remove test container
        if: always()
        run: docker rm -f odg-api-ci || true
