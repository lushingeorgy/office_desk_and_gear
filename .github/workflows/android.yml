name: Android APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'client/**'
      - 'main.py'
      - 'buildozer.spec'
      - 'p4a-recipes/**'
      - '.github/workflows/android.yml'
concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf libtool libltdl-dev pkg-config zlib1g-dev libncurses-dev libtinfo6 cmake ninja-build libffi-dev libssl-dev automake autopoint gettext ccache patch
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'git+https://github.com/kivy/buildozer.git@76bac28545c66bbcc671d49aca553a747d69608e' 'Cython==0.29.34'
      - name: Check client source
        run: python -m compileall -q client main.py
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: android-v3-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'p4a-recipes/**') }}
      - run: buildozer -v android debug
      - name: Preserve native build cache
        continue-on-error: true
        if: always() && steps.native-cache.outcome == 'success' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: OfficeDeskGear-android-debug
          path: bin/*.apk
          if-no-files-found: error
  android-runtime:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: runtime-ci-only-password
          POSTGRES_DB: odg_runtime
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d odg_runtime"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://postgres:runtime-ci-only-password@127.0.0.1:5432/odg_runtime
      APP_ENV: test
      ENVIRONMENT: test
      JWT_SECRET: runtime-ci-only-signing-secret-minimum-32-characters
      REQUIRE_EMAIL_VERIFICATION: '0'
      MAIL_MODE: outbox
      TZ: Europe/Moscow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: OfficeDeskGear-android-debug
          path: runtime-apk
      - name: Install runtime test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-rus
          python -m pip install -r requirements-dev.txt pytesseract
      - name: Start isolated API and PostgreSQL fixtures
        run: |
          mkdir -p tests/artifacts/android-runtime
          python -m alembic upgrade head
          python -m server.cli seed-demo
          python -m uvicorn server.main:app --host 0.0.0.0 --port 8000 >tests/artifacts/android-runtime/api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the actual ARM64 APK on Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 600
          disable-animations: true
          enable-hw-keyboard: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          script: python tests/android_runtime.py --apk $(find runtime-apk -name '*.apk' -print -quit)
      - name: Save native runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OfficeDeskGear-android-runtime
          path: tests/artifacts/android-runtime/
          if-no-files-found: warn
