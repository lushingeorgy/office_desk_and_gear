name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['buildozer.spec']
  pull_request:
    paths:
      - 'client/**'
      - 'main.py'
      - 'buildozer.spec'
      - 'p4a-recipes/**'
      - '.github/workflows/android.yml'
concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'reuse-remote-test-apk')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Development APKs only: keep the same debug certificate across this
      # branch/PR's test builds so adb install -r preserves private app data.
      # A release signing key must never be placed in this public-repo cache.
      - name: Restore development APK signing key
        id: debug-signing
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: android-development-signing-v1-${{ runner.os }}
      - name: Prepare development APK signing key
        run: |
          umask 077
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
          echo 'Development APK certificate SHA-256:'
          keytool -exportcert -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey | sha256sum
      - name: Preserve development APK signing key before building
        if: steps.debug-signing.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: ${{ steps.debug-signing.outputs.cache-primary-key }}
      - name: Require persisted development signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ${{ steps.debug-signing.outputs.cache-primary-key }}
          lookup-only: true
          fail-on-cache-miss: true
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf libtool libltdl-dev pkg-config zlib1g-dev libncurses-dev libtinfo6 cmake ninja-build libffi-dev libssl-dev automake autopoint gettext ccache patch
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'git+https://github.com/kivy/buildozer.git@76bac28545c66bbcc671d49aca553a747d69608e' 'Cython==0.29.34'
      - name: Check client source
        run: python -m compileall -q client main.py
      - name: Compute native build fingerprint
        id: native-fingerprint
        run: |
          python - <<'PY'
          from pathlib import Path
          import configparser, hashlib, json, os, re
          config = configparser.ConfigParser(interpolation=None)
          config.read('buildozer.spec', encoding='utf-8')
          keys = ('requirements', 'android.ndk', 'android.ndk_api', 'android.archs',
                  'p4a.bootstrap', 'p4a.commit', 'p4a.branch', 'p4a.url', 'p4a.fork')
          native = {key: config.get('app', key, fallback='').strip() for key in keys}
          workflow = Path('.github/workflows/android.yml').read_text(encoding='utf-8')
          native['buildozer'] = re.search(r'buildozer\.git@([0-9a-f]{40})', workflow).group(1)
          native['host_python'] = re.search(r'python-version:\s*[\x22\x27]([^\x22\x27]+)', workflow).group(1)
          native['host_cython'] = re.search(r'Cython==([0-9.]+)', workflow).group(1)
          digest = hashlib.sha256(json.dumps(native, sort_keys=True, separators=(',', ':')).encode())
          for path in sorted(Path('p4a-recipes').rglob('*')):
              if path.is_file() and '__pycache__' not in path.parts and path.suffix not in {'.pyc', '.pyo'}:
                  digest.update(path.as_posix().encode() + b'\0' + path.read_bytes().replace(b'\r\n', b'\n'))
          fingerprint = digest.hexdigest()
          key = f"android-native-v1-{os.environ['RUNNER_OS']}-{fingerprint}"
          # Migrate the already-built v3 cache only for these exact native inputs.
          # A later native dependency or recipe change must never restore that legacy distribution.
          known_legacy = 'ab0a049dbb9f6d078a20f983baf9446e2f8259b7ec5a79842f5f76826e69243c'
          legacy_prefix = f"android-v3-{os.environ['RUNNER_OS']}-" if fingerprint == known_legacy else ''
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'key={key}\nlegacy-prefix={legacy_prefix}\n')
          print(f'Native build fingerprint: {fingerprint}')
          PY
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ steps.native-fingerprint.outputs.key }}
          restore-keys: ${{ steps.native-fingerprint.outputs.legacy-prefix }}
      - name: Require the fixed shipping API before packaging
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          config = ast.parse(Path('client/core/config.py').read_text(encoding='utf-8'))
          defaults = [node.value.value for node in config.body if isinstance(node, ast.Assign)
                      and any(isinstance(target, ast.Name) and target.id == 'DEFAULT_API_URL' for target in node.targets)
                      and isinstance(node.value, ast.Constant)]
          assert defaults == ['https://v3294121.hosted-by-vdsina.ru/office-desk-gear/api/v1'], defaults
          PY
      - run: buildozer -v android debug
      - name: Sign and verify the actual APK with the persisted development key
        shell: bash
        run: |
          set -euo pipefail
          cat >"$RUNNER_TEMP/sign-development-apk.sh" <<'SH'
          set -euo pipefail
          sdk_tools="$HOME/.buildozer/android/platform/android-sdk/build-tools"
          tools_version=$(find "$sdk_tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)
          signer="$sdk_tools/$tools_version/apksigner"
          aligner="$sdk_tools/$tools_version/zipalign"
          test -x "$signer"
          test -x "$aligner"
          apk="$1"
          report="$2"
          mkdir -p "$report"
          expected=$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey | sha256sum | awk '{print $1}')
          printf '%s\n' "$expected" >"$report"/expected-certificate.sha256
          "$signer" verify --verbose --print-certs "$apk" >"$report"/before.txt
          # Align before signing, including native libraries on 16 KiB devices.
          aligned="$RUNNER_TEMP/officedeskgear-development-aligned.apk"
          "$aligner" -f -P 16 4 "$apk" "$aligned"
          "$aligner" -c -P 16 4 "$aligned"
          signed="$RUNNER_TEMP/officedeskgear-development-signed.apk"
          "$signer" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android --v4-signing-enabled false \
            --out "$signed" "$aligned"
          "$signer" verify --verbose --print-certs "$signed" | tee "$report"/verified.txt
          # SDK 37 labels this "V3.0 Signer"; older tools use "Signer #1".
          # Deduplicate the same certificate reported for multiple schemes.
          actual=$(sed -nE 's/^.*certificate SHA-256 digest: ([[:xdigit:]]{64})$/\1/p' "$report"/verified.txt | tr 'A-F' 'a-f' | sort -u)
          signer_count=$(sed -n 's/^Number of signers: //p' "$report"/verified.txt)
          test "$signer_count" -eq 1
          test "$actual" = "$expected"
          mv "$signed" "$apk"
          echo "Verified development APK certificate SHA-256: $actual"
          SH
          mapfile -t apks < <(find bin -maxdepth 1 -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          bash "$RUNNER_TEMP/sign-development-apk.sh" "${apks[0]}" tests/artifacts/android-signing/shipping
      - name: Preserve native build cache
        continue-on-error: true
        if: always() && steps.native-cache.outcome == 'success' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Verify the shipping endpoint in the packaged client
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, io, tarfile, zipfile
          apk, = Path('bin').glob('*.apk')
          with zipfile.ZipFile(apk) as archive:
              with tarfile.open(fileobj=io.BytesIO(archive.read('assets/private.tar'))) as private:
                  config = private.extractfile('client/core/config.pyc').read()
                  icon = private.extractfile('client/assets/icon.png').read()
                  app = private.extractfile('client/app.pyc').read()
                  floor_plan = private.extractfile('client/floor_plan.pyc').read()
                  assert private.getmember('client/desktop.pyc').size > 0
                  assert b'FloorPlan' in app and b'_select_map_floor' in app
                  assert b'select_floor' in floor_plan and b'move_floor' in floor_plan
                  assert b'desks:complete:' in app
                  for obsolete in ('Предыдущие 20', 'Следующие 20'):
                      assert obsolete.encode('utf-8') not in app
              native_icon = archive.read('res/mipmap/icon.png')
          assert hashlib.sha256(icon).digest() == hashlib.sha256(Path('client/assets/icon.png').read_bytes()).digest()
          # Reject the default Kivy launcher icon used by previous builds.
          assert hashlib.sha256(native_icon).hexdigest() != '15edd4ad4ac8926999b8dbf8558d6ca9ef8ff8f7ac660a85c4c2e5e90903586f'
          assert b'https://v3294121.hosted-by-vdsina.ru/office-desk-gear/api/v1' in config
          assert b'http://10.0.2.2:8000/api/v1' not in config
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: OfficeDeskGear-android-debug
          path: bin/*.apk
          if-no-files-found: error
      - name: Prepare an explicitly separate QA package for the isolated emulator API
        run: |
          python - <<'PY'
          from pathlib import Path
          import configparser
          config = Path('client/core/config.py')
          source = config.read_text(encoding='utf-8')
          shipping = '"https://v3294121.hosted-by-vdsina.ru/office-desk-gear/api/v1"'
          assert source.count(shipping) == 1
          config.write_text(source.replace(shipping, '"http://10.0.2.2:8000/api/v1"'), encoding='utf-8')
          spec = configparser.ConfigParser(interpolation=None)
          spec.read('buildozer.spec', encoding='utf-8')
          assert spec.get('app', 'package.domain') == 'org.officedeskgear'
          assert spec.get('app', 'package.name') == 'officedeskgear'
          spec.set('app', 'package.name', 'officedeskgearqa')
          spec.set('app', 'title', 'Office Desk Gear QA')
          with open('buildozer.spec', 'w', encoding='utf-8') as output:
              spec.write(output)
          # Only the previously uploaded build output is removed, not the native cache.
          for apk in Path('bin').glob('*.apk'):
              apk.unlink()
          PY
      - name: Build the QA package using the warm native distribution
        run: buildozer -v android debug
      - name: Sign and verify the separately packaged QA APK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find bin -maxdepth 1 -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          bash "$RUNNER_TEMP/sign-development-apk.sh" "${apks[0]}" tests/artifacts/android-signing/qa
      - uses: actions/upload-artifact@v4
        with:
          name: OfficeDeskGear-android-runtime-qa
          path: bin/*qa*.apk
          if-no-files-found: error
      - name: Save APK signing verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OfficeDeskGear-apk-signing
          path: tests/artifacts/android-signing/
          if-no-files-found: warn
  android-remote-runtime:
    needs: apk
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'run-remote-acceptance')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      ODG_REMOTE_ACCEPTANCE: '1'
      ODG_REMOTE_SCOPE: ${{ contains(github.event.pull_request.labels.*.name, 'run-home-map-regression') && 'home-map' || 'full' }}
      TZ: Europe/Moscow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: OfficeDeskGear-android-debug
          path: runtime-apk
      - name: Install black-box test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-rus
          python -m pip install requests pillow pytesseract opencv-python-headless
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Explicit PR label opts into writes to the user's staging API. No SSH
      # credentials are provided to Actions; actors register through the UI.
      - name: Exercise shipping APK against the remote staging API
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 600
          disable-animations: true
          enable-hw-keyboard: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          script: python tests/android_remote_runtime.py --scope "$ODG_REMOTE_SCOPE" --apk $(find runtime-apk -name '*.apk' -print -quit)
      - name: Save remote native acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OfficeDeskGear-android-remote-runtime
          path: tests/artifacts/android-remote-runtime/
          if-no-files-found: warn
  android-runtime:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: runtime-ci-only-password
          POSTGRES_DB: odg_runtime
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d odg_runtime"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://postgres:runtime-ci-only-password@127.0.0.1:5432/odg_runtime
      APP_ENV: test
      ENVIRONMENT: test
      JWT_SECRET: runtime-ci-only-signing-secret-minimum-32-characters
      REQUIRE_EMAIL_VERIFICATION: '1'
      MAIL_MODE: outbox
      TZ: Europe/Moscow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: OfficeDeskGear-android-runtime-qa
          path: runtime-apk
      - name: Install runtime test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-rus
          python -m pip install -r requirements-dev.txt pytesseract opencv-python-headless
      - name: Start isolated API and PostgreSQL fixtures
        run: |
          mkdir -p tests/artifacts/android-runtime
          python -m alembic upgrade head
          python -m server.cli seed-demo
          python -m uvicorn server.main:app --host 0.0.0.0 --port 8000 >tests/artifacts/android-runtime/api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # API 30's libndk_translation crashes on CPython's valid scalar FCVTZU
      # instruction. Use the current Android 15 Google APIs image; its official
      # build.prop advertises arm64-v8a and libndk_translation.so. The test still
      # fails on missing translation, any native crash, or any failed UI check.
      # https://developer.android.com/tools/releases/platforms
      - name: Run the isolated QA ARM64 APK on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 600
          disable-animations: true
          enable-hw-keyboard: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          script: |
            python tests/android_runtime.py --package org.officedeskgear.officedeskgearqa --apk $(find runtime-apk -name '*.apk' -print -quit)
            python tests/android_auth_runtime.py
      - name: Save native runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OfficeDeskGear-android-runtime
          path: |
            tests/artifacts/android-runtime/
            tests/artifacts/android-auth-runtime/
          if-no-files-found: warn
